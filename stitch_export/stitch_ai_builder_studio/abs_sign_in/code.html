<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-panel {
            background: rgba(22, 22, 22, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .glow-border {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }
        
        /* Custom Input Styles */
        input[type="email"], input[type="password"] {
            background-color: #0A0A0A;
            border: 1px solid #262626;
            color: #e5e2e1;
            transition: all 0.2s ease;
        }
        
        input[type="email"]:focus, input[type="password"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
            outline: none;
        }
    </style>
</head>
<body class="bg-[#0A0A0A] text-on-surface min-h-screen flex items-center justify-center p-md font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Pattern/Gradient (Subtle) -->
<div class="fixed inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 50% 0%, #4f46e5 0%, transparent 50%);"></div>
<main class="w-full max-w-[420px] relative z-10">
<!-- Logo Area -->
<div class="flex flex-col items-center justify-center mb-xl">
<div class="w-16 h-16 rounded-xl overflow-hidden mb-lg shadow-lg">
<img alt="ABS Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtGudkTY9_nAvLthTaWRiVim4xTa__fUbima39ryJ6NgRNKLO1raznUhOyAvzNnozMa2xQnlk_SkDBD0RhZgBAYkuZ1xilLp5Doei8pBPYnRqUvOaNertr2tGtB-325mN2KVru2z2_dxJMzbShGJou4Ge4_OBCCJ-OP0vcS7nLZ-BH58oIqRj7ldixteWUVAguJ20qNqnVj_y5_yhR4ARP3_fCzI8QOCFc9o_JNPhB92GSqMLrBJXD"/>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to continue to AI Builder Studio</p>
</div>
<!-- Auth Card -->
<div class="glass-panel rounded-xl border border-[#262626] p-lg shadow-2xl relative overflow-hidden">
<!-- Tabs (Sign In / Sign Up) -->
<div class="flex border-b border-[#262626] mb-lg">
<button class="flex-1 pb-sm font-label-caps text-label-caps text-primary border-b-2 border-primary transition-colors">SIGN IN</button>
<button class="flex-1 pb-sm font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors">SIGN UP</button>
</div>
<!-- Form -->
<form class="space-y-md">
<!-- Email -->
<div class="space-y-xs">
<label class="block font-body-sm text-body-sm text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[18px]">mail</span>
<input class="w-full rounded-lg pl-10 pr-3 py-2 font-body-md text-body-md placeholder:text-on-surface-variant/40" id="email" name="email" placeholder="developer@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-body-sm text-body-sm text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[18px]">lock</span>
<input class="w-full rounded-lg pl-10 pr-10 py-2 font-body-md text-body-md placeholder:text-on-surface-variant/40" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary-container text-white rounded-lg py-2 font-body-md text-body-md font-semibold glow-border hover:bg-inverse-primary transition-all active:scale-[0.98] flex items-center justify-center gap-2 mt-lg" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-lg">
<div class="flex-grow border-t border-[#262626]"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant">or</span>
<div class="flex-grow border-t border-[#262626]"></div>
</div>
<!-- Social Auth -->
<button class="w-full bg-transparent border border-[#262626] text-on-surface rounded-lg py-2 px-4 font-body-md text-body-md hover:bg-surface-container-high transition-colors flex items-center justify-center gap-3">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<button class="w-full bg-transparent border border-[#262626] text-on-surface rounded-lg py-2 px-4 font-body-md text-body-md hover:bg-surface-container-high transition-colors flex items-center justify-center gap-3 mt-md">
<svg class="w-5 h-5 text-on-surface fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.6.113.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"></path>
</svg>
                Continue with GitHub
            </button>
</div>
<div class="text-center mt-lg">
<p class="font-body-sm text-body-sm text-on-surface-variant">Don't have an account? <a class="text-primary hover:text-primary-container transition-colors font-medium" href="#">Create Account</a></p>
</div>
</main>
<!-- Footer Component (suppressed per instructions for transactional pages, but keeping minimal version if needed, omitted here as per 'Linear/Transactional' rule) -->
</body></html>
